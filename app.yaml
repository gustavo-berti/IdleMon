runtime: python312

entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 idlepokemon.wsgi

env_variables:
  DJANGO_SETTINGS_MODULE: "idlepokemon.settings"

handlers:
  - url: /static

    static_dir: static_gcloud/

  - url: /.*

    script: auto

automatic_scaling:
  min_instances: 0
  max_instances: 2
