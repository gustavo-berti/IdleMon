{% extends 'website/template.html' %} 

{% block title %}IdleMon - Sua Colecao{%endblock %}

{% block content %}
<div class="row text-center mb-4">
  <h2>Suas Boxes</h2>
  <p class="text-muted">Gerencie sua coleção e organize seus Pokémons.</p>
</div>

<div class="row justify-content-center mb-5">
  <div class="col-md-10 box-container shadow">
    <div
      class="d-flex justify-content-center align-items-center h-100 text-muted"
    >
      <h4>[Conteúdo da Box Atual]</h4>
    </div>
  </div>
</div>

<div class="row mt-auto text-center">
  <div class="col-12 bg-white p-4 rounded shadow-sm border">
    <h4 class="mb-3">Equipe Ativa (Gerando Moedas)</h4>
    <div class="d-flex justify-content-center gap-3">
      <div class="team-slot shadow-sm">+</div>
      <div class="team-slot shadow-sm">+</div>
      <div class="team-slot shadow-sm">+</div>
      <div class="team-slot shadow-sm">+</div>
      <div class="team-slot shadow-sm">+</div>
      <div class="team-slot shadow-sm">+</div>
    </div>
    <p class="mt-3 text-success fw-bold small">
      Rendimento atual: 15 moedas / hora
    </p>
  </div>
</div>
{% endblock %}
