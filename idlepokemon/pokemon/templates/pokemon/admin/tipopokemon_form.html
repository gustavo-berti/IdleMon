{% extends "website/template.html" %}
{% load crispy_forms_tags %}

{% block title %}{% if object %}Editar{% else %}Novo{% endif %} Tipo - Admin{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-4">{% if object %}Editar Tipo{% else %}Novo Tipo{% endif %}</h2>
      
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        
        <div class="mt-4">
          <button type="submit" class="btn btn-poke me-2">Salvar</button>
          <a href="{% url 'tipopokemon_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
