{% extends "website/template.html" %}
{% load crispy_forms_tags %}

{% block title %}Editar {{ pokemon.nickname }}{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="mb-1">Editar {{ pokemon.nickname }}</h2>
          <p class="text-muted mb-4">{{ pokemon.species.name }}</p>

          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}

            <div class="mt-4">
              <button type="submit" class="btn btn-poke me-2">Salvar</button>
              <a href="{% url 'pokemon_detail' pokemon.pk %}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
