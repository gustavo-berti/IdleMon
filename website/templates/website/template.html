{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}IdleMon - Gerenciador de Colecao{% endblock %}
    </title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'css/template.css' %}" rel="stylesheet" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% include 'website/partials/navbar.html' %}

    <main class="container my-4 d-flex flex-column justify-content-center">
      {% block content %}{% endblock %}
    </main>

    <footer class="py-3 mt-auto">
      <div class="container text-center">
        <span class="small">© 2026 IdleMon. Projeto Acadêmico.</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
