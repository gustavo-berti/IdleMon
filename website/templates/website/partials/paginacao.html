{% load paginacao %}
{% if is_paginated %}
<nav class="mt-4" aria-label="Paginação">
  <ul class="pagination justify-content-center">

    {% if page_obj.has_previous %}
    <li class="page-item">
      <a class="page-link" href="?{% parametros_url page=1 %}">« Primeira</a>
    </li>
    <li class="page-item">
      <a class="page-link" href="?{% parametros_url page=page_obj.previous_page_number %}">← Anterior</a>
    </li>
    {% endif %}

    <li class="page-item disabled">
      <span class="page-link">
        Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
      </span>
    </li>

    {% if page_obj.has_next %}
    <li class="page-item">
      <a class="page-link" href="?{% parametros_url page=page_obj.next_page_number %}">Próxima →</a>
    </li>
    <li class="page-item">
      <a class="page-link" href="?{% parametros_url page=page_obj.paginator.num_pages %}">Última »</a>
    </li>
    {% endif %}

  </ul>
</nav>
{% endif %}
